[package]
name = "hibari-os-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
hibari-os-core = { path = "../crates/hibari-os-core" }
hibari-os-kernel = { path = "../crates/hibari-os-kernel" }

# Not part of the main workspace (needs nightly).
[workspace]

[[bin]]
name = "gestures"
path = "fuzz_targets/gestures.rs"
test = false
doc = false
bench = false

[[bin]]
name = "kernel"
path = "fuzz_targets/kernel.rs"
test = false
doc = false
bench = false
