[package]
name = "hibari-board-s3-amoled-206"
description = "Hibari OS, a thin operating system for ESP32 boards, written in Rust: firmware for the Waveshare ESP32-S3-Touch-AMOLED-2.06 (esp-hal, no_std, no ESP-IDF)"
readme = "README.md"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
keywords = ["esp32", "esp32s3", "esp-hal", "embedded", "no-std"]
categories = ["embedded", "no-std", "os"]

[[bin]]
name = "hibari-board-s3-amoled-206"
path = "src/main.rs"
test = false

[features]
# Ask the build for a renderer. With none of these the board file or the automatic rule decides. If several
# are on, the lightest wins. This firmware links only the integer backend today, so another choice is
# reported at boot and drawn with the integer one.
render-integer = []
render-skia = []
render-vello-cpu = []
render-vello-gpu = []

[dependencies]
hibari-device = { path = "../../crates/hibari-device" }
hibari-hal = { path = "../../crates/hibari-hal" }
hibari-drivers = { path = "../../crates/hibari-drivers" }
hibari-launcher = { path = "../../crates/hibari-launcher" }
fusuma-render-embedded = "0.2"
esp-hal = { version = "1.0.0", features = ["esp32s3", "unstable", "psram", "log-04"] }
esp-alloc = "0.9.0"
esp-println = { version = "0.16.1", features = ["esp32s3", "log-04"] }
esp-backtrace = { version = "0.18.1", features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.4", features = ["esp32s3"] }
log = "0.4"

[build-dependencies]
hibari-device = { path = "../../crates/hibari-device", features = ["toml"] }

[profile.dev]
opt-level = "s"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = "line-tables-only"
