# The Waveshare ESP32-S3-Touch-AMOLED-2.06: the one description of this device. The firmware gets its
# constants from it at build time (build.rs), the host preview loads it, and `scripts/native.nu` reads
# the [firmware] table.
name = "waveshare-s3-amoled-2.06"
capabilities = ["display", "touch", "button", "wifi", "ble", "battery", "rtc", "imu", "storage"]

[display]
width = 410
height = 502
shape = "rect"
# The panel's memory is 22 columns wider on the left than what is visible.
offset = [22, 0]

[firmware]
chip = "esp32s3"
target = "xtensa-esp32s3-none-elf"
flash_mb = 32

# What the chip has. The renderer choice (hibari_device::choose) reads this. 8 MB of PSRAM is on this board;
# the 512 KB of internal RAM and the single-precision FPU are the ESP32-S3's datasheet values as I remember
# them, not measured here.
[hardware]
ram_kb = 512
psram_kb = 8192
fpu = true
# Vello has no SIMD code for Xtensa, so the automatic choice is the integer renderer.
simd = false
gpu = false

# Uncomment to pin a renderer for this board; leave it out for the automatic choice.
# [render]
# backend = "vello-cpu"   # integer, vello-cpu or vello-gpu
# fallback = false        # true: step down to a lighter backend if the chosen one does not fit
