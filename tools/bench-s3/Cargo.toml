[package]
name = "hibari-bench-s3"
description = "Hibari OS, a thin operating system for ESP32 boards: benchmark of vello_cpu against the integer renderer on the ESP32-S3 (not published)"
readme = "README.md"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "hibari-bench-s3"
path = "src/main.rs"
test = false

[dependencies]
# Local paths until the no_std Vello backend is released; one `fusuma-render` for all three.
fusuma-render = { path = "../../../../fusuma/crates/fusuma-render" }
fusuma-render-embedded = { path = "../../../../fusuma/crates/fusuma-render-embedded" }
fusuma-render-vello-cpu = { path = "../../../../fusuma/crates/fusuma-render-vello-cpu", default-features = false, features = ["libm"] }
vello_cpu = { version = "0.4", default-features = false, features = ["libm", "u8_pipeline"] }
esp-hal = { version = "1.0.0", features = ["esp32s3", "unstable", "psram", "log-04"] }
esp-alloc = "0.9.0"
esp-println = { version = "0.16.1", features = ["esp32s3", "log-04"] }
esp-backtrace = { version = "0.18.1", features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.4", features = ["esp32s3"] }
log = "0.4"

[profile.dev]
opt-level = "s"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = "line-tables-only"
