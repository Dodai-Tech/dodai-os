# A round smartwatch: 466 px, no WiFi. A simulated device for the host preview.
name = "watch-round"
capabilities = ["display", "touch", "button", "ble", "battery", "imu", "storage"]

[display]
width = 466
height = 466
shape = "round"

# A round smartwatch class: an ESP32-S3 with PSRAM.
[hardware]
ram_kb = 512
psram_kb = 8192
fpu = true
