[package]
name = "hibari-demo-s3-vello"
description = "Hibari OS, a thin operating system for ESP32 boards: a demo of vello_cpu drawing an anti-aliased launcher on the ESP32-S3 (not published)"
readme = "README.md"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "hibari-demo-s3-vello"
path = "src/main.rs"
test = false

[dependencies]
hibari-board-s3-amoled-206 = { path = "../../boards/s3-amoled-206" }
hibari-hal = { path = "../../crates/hibari-hal" }
hibari-drivers = { path = "../../crates/hibari-drivers" }
vello_cpu = { version = "0.4", default-features = false, features = ["libm", "u8_pipeline"] }
esp-hal = { version = "1.0.0", features = ["esp32s3", "unstable", "psram", "log-04"] }
esp-alloc = "0.9.0"
esp-println = { version = "0.16.1", features = ["esp32s3", "log-04"] }
esp-backtrace = { version = "0.18.1", features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.4", features = ["esp32s3"] }
log = "0.4"

[profile.dev]
opt-level = "s"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = "line-tables-only"
