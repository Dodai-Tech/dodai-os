[package]
name = "hibari-bench-c6"
description = "Hibari OS, a thin operating system for ESP32 boards: how large a surface vello_cpu can draw on an ESP32-C6, which has no PSRAM (not published)"
readme = "README.md"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "hibari-bench-c6"
path = "src/main.rs"
test = false

[dependencies]
# Local paths: the no_std Vello backend is not released yet.
fusuma-render = { path = "../../../../fusuma/crates/fusuma-render" }
fusuma-render-embedded = { path = "../../../../fusuma/crates/fusuma-render-embedded" }
fusuma-render-skia = { path = "../../../../fusuma/crates/fusuma-render-skia", default-features = false }
fusuma-render-vello-cpu = { path = "../../../../fusuma/crates/fusuma-render-vello-cpu", default-features = false, features = ["libm"] }
# Pinned: esp-hal 1.2 keeps a different app-descriptor section than esp-bootloader-esp-idf 0.4 writes, and
# the image then has no descriptor and cannot be flashed. The S3 firmware is locked to 1.0.0 as well.
esp-hal = { version = "=1.0.0", features = ["esp32c6", "unstable", "log-04"] }
esp-alloc = "0.9.0"
esp-println = { version = "0.16.1", features = ["esp32c6", "log-04"] }
esp-backtrace = { version = "0.18.1", features = ["esp32c6", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.4", features = ["esp32c6"] }
log = "0.4"

[profile.dev]
opt-level = "s"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = "line-tables-only"
