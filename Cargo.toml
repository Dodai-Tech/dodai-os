[workspace]
resolver = "3"
# Only host-testable code is a workspace member. Firmware crates need the ESP toolchain and
# their own .cargo/config.toml + rust-toolchain.toml, so they are excluded and build on their own.
members = [
    "crates/hibari-os-core",
    "crates/hibari-os-hal",
    "crates/hibari-os-kernel",
    "crates/hibari-os-shell-model",
    "crates/hibari-os-shell",
    "crates/hibari-os-drivers",
    "crates/hibari-os-host",
]
exclude = [
    "crates/hibari-os-esp32s3",
    "crates/hibari-os-s3-amoled-206",
    "crates/hibari-os-s3-bench",
]

# One version for the core and the workspace; `just bump X.Y.Z` edits it. Firmware crates keep
# their own version (they are not part of the release).
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Sorin Albu-Irimies"]
keywords = ["esp32", "esp32s3", "esp-hal", "embedded", "no-std"]
categories = ["embedded", "no-std", "os"]
repository = "https://github.com/Dodai-Tech/hibari-os"

[workspace.dependencies]
hibari-os-core = { path = "crates/hibari-os-core", version = "0.1.0" }
hibari-os-hal = { path = "crates/hibari-os-hal", version = "0.1.0" }
hibari-os-shell-model = { path = "crates/hibari-os-shell-model", version = "0.1.0" }
hibari-os-shell = { path = "crates/hibari-os-shell", version = "0.1.0" }
embedded-hal = "1.0"
embedded-graphics = "0.8.2"
fusuma-anim = "0.2"
fusuma-render = "0.2"
fusuma-render-embedded = "0.2"
fusuma-render-vello-cpu = "0.2.0"
minifb = { version = "0.29", default-features = false, features = ["x11"] }
png = "0.18"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
