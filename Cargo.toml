[workspace]
resolver = "3"
# Only host-testable code is a workspace member. Firmware crates need the ESP toolchain and
# their own .cargo/config.toml + rust-toolchain.toml, so they are excluded and build on their own.
members = [
    "crates/dodai-os-core",
    "crates/dodai-os-hal",
    "crates/dodai-os-kernel",
    "crates/dodai-os-shell-model",
    "crates/dodai-os-shell",
    "crates/dodai-os-drivers",
    "crates/dodai-os-host",
]
exclude = [
    "crates/dodai-os-esp32s3",
    "crates/dodai-os-s3-amoled-206",
]

# One version for the core and the workspace; `just bump X.Y.Z` edits it. Firmware crates keep
# their own version (they are not part of the release).
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Sorin Albu-Irimies"]
repository = "https://github.com/Dodai-Tech/dodai-os"
homepage = "https://github.com/Dodai-Tech/dodai-os"

[workspace.dependencies]
dodai-os-core = { path = "crates/dodai-os-core", version = "0.1.0" }
dodai-os-hal = { path = "crates/dodai-os-hal", version = "0.1.0" }
dodai-os-kernel = { path = "crates/dodai-os-kernel", version = "0.1.0" }
dodai-os-shell-model = { path = "crates/dodai-os-shell-model", version = "0.1.0" }
dodai-os-shell = { path = "crates/dodai-os-shell", version = "0.1.0" }
dodai-os-drivers = { path = "crates/dodai-os-drivers", version = "0.1.0" }
embedded-hal = "1.0"
embedded-graphics = "0.8.2"
# The renderer crates live in ../fusuma (private until it is published to crates.io; then drop the paths).
fusuma-render = { path = "../fusuma/crates/fusuma-render", version = "0.1.0" }
fusuma-render-embedded = { path = "../fusuma/crates/fusuma-render-embedded", version = "0.1.0" }
fusuma-render-skia = { path = "../fusuma/crates/fusuma-render-skia", version = "0.1.0" }
minifb = { version = "0.29", default-features = false, features = ["x11"] }
png = "0.18"
dodai-os-host = { path = "crates/dodai-os-host", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
