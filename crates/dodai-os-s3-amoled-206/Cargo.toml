[package]
name = "dodai-os-s3-amoled-206"
description = "Dodai OS firmware for the Waveshare ESP32-S3-Touch-AMOLED-2.06 (esp-hal, no_std, no ESP-IDF)"
readme = "README.md"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "dodai-os-s3-amoled-206"
path = "src/main.rs"
test = false

[dependencies]
dodai-os-core = { path = "../dodai-os-core" }
dodai-os-hal = { path = "../dodai-os-hal" }
dodai-os-drivers = { path = "../dodai-os-drivers" }
dodai-os-shell = { path = "../dodai-os-shell" }
dodai-os-shell-model = { path = "../dodai-os-shell-model" }
fusuma-render-embedded = "0.2"
esp-hal = { version = "1.0.0", features = ["esp32s3", "unstable", "psram", "log-04"] }
esp-alloc = "0.9.0"
esp-println = { version = "0.16.1", features = ["esp32s3", "log-04"] }
esp-backtrace = { version = "0.18.1", features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.4", features = ["esp32s3"] }
log = "0.4"

[profile.dev]
opt-level = "s"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = "line-tables-only"
