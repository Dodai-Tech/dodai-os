[package]
name = "hibari-os-esp32s3"
readme = "README.md"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Hibari OS, a thin operating system for ESP32 boards, written in Rust: sample ESP-IDF firmware for the ESP32-S3"
publish = false
keywords = ["esp32", "esp32s3", "esp-hal", "embedded", "no-std"]
categories = ["embedded", "no-std", "os"]
resolver = "2"

# Not a workspace member: it needs the ESP toolchain (see .cargo/config.toml and rust-toolchain.toml).
[[bin]]
name = "hibari-os-esp32s3"
harness = false

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "s"

[dependencies]
hibari-os-core = { path = "../hibari-os-core" }
log = "0.4"
anyhow = "1"
esp-idf-svc = { version = "0.53", features = ["experimental"] }

[build-dependencies]
embuild = "0.33"
toml = "0.8"
