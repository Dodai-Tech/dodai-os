[package]
name = "dodai-os-host"
description = "Dodai OS hosted backend: runs on Linux, macOS and Windows with device profiles for development"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
name = "dodai_os_host"
path = "src/lib.rs"

[features]
# A real window (minifb): mouse as touch. Off by default so CI needs no display libraries.
window = ["dep:minifb"]

[dependencies]
dodai-os-core.workspace = true
dodai-os-hal.workspace = true
dodai-os-shell.workspace = true
dodai-os-shell-model.workspace = true
embedded-graphics.workspace = true
tokonoma.workspace = true
tokonoma-embedded.workspace = true
tokonoma-skia.workspace = true
png.workspace = true
minifb = { workspace = true, optional = true }

[lints]
workspace = true

[[bin]]
name = "dodai-os-host"
path = "src/main.rs"
